<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memoshot | Photobooth Business</title>
<style>
:root{--navy:#111827;--pink:#f45b91;--pink2:#fff0f5;--blue:#2563eb;--green:#15956b;--muted:#64748b;--line:#e5eaf2;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--pink);color:white;font-weight:650}button.secondary{background:white;color:#263247;border:1px solid var(--line)}button.dark{background:var(--navy)}button.danger{background:#dc3545}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:white;padding:22px 14px}.brand{font-size:24px;font-weight:850;margin:0 10px 4px}.brand span{color:#ff7aa7}.tag{color:#aab4c5;font-size:12px;margin:0 10px 26px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd5e1;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#2c3548;color:white}.nav button.active{box-shadow:inset 3px 0 var(--pink)}.sidefoot{font-size:11px;color:#8995a8;margin:35px 10px}.main{min-width:0}.topbar{background:white;border-bottom:1px solid var(--line);padding:15px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar small{color:var(--muted)}.content{padding:24px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pagehead h1{font-size:25px;margin:0}.pagehead p{color:var(--muted);margin:4px 0 0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 3px 12px #17203305;min-width:0}.statlabel{color:var(--muted);font-size:12px}.statvalue{font-size:25px;font-weight:800;margin-top:8px}.pink{color:var(--pink)}.green{color:var(--green)}.blue{color:var(--blue)}.twocol{grid-template-columns:1.25fr 1fr}.card h2{font-size:16px;margin:0 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f5;font-size:13px}th{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#eef2ff;color:#475569}.pill.Confirmed,.pill.Completed,.pill.Paid{background:#dcfce7;color:#166534}.pill.Pending,.pill.Deposit{background:#fff4d6;color:#925b00}.pill.Cancelled{background:#fee2e2;color:#991b1b}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#536176;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:9px;padding:10px;background:white;color:#172033}.field textarea{min-height:75px}.full{grid-column:1/-1}.hidden{display:none!important}.empty{padding:26px;text-align:center;color:var(--muted)}.packagegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.package h3{margin:0}.price{font-size:24px;font-weight:850;margin:9px 0}.package p{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:white}.modal{position:fixed;inset:0;background:#0b1220a6;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{background:white;border-radius:16px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.modalhead button{background:#eef2f7;color:#172033;padding:6px 10px}.boothgrid{grid-template-columns:1.4fr 1fr}.camera{background:#101827;border-radius:12px;min-height:280px;display:grid;place-items:center;overflow:hidden;position:relative;color:#cbd5e1}.camera video,.camera img{width:100%;max-height:470px;object-fit:contain}.camera .placeholder{text-align:center;padding:25px}.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:12px}.frame-preview{padding:10px;border:4px solid var(--frame-accent,#f45b91);background:var(--frame-bg,#111827);color:var(--frame-text,#fff);border-radius:8px}.frame-title,.frame-footer{text-align:center;font-weight:800;overflow-wrap:anywhere}.frame-title{font-size:13px;margin-bottom:8px}.frame-footer{font-size:10px;margin-top:8px}.frame-logo{display:block;max-width:70px;max-height:35px;object-fit:contain;margin:0 auto 6px}.frame-preview .strip img{border:2px solid var(--frame-text,#fff);box-shadow:none}.strip img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid white;box-shadow:0 0 0 1px #ddd}.muted{color:var(--muted)}.calendarlist{display:grid;gap:9px}.eventrow{border:1px solid var(--line);padding:12px;border-radius:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.eventrow strong{display:block}.footnote{font-size:11px;color:var(--muted);margin-top:18px}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:12px;margin-bottom:14px}
@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.sidebar{padding:16px 10px}.brand{font-size:21px}.content{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.packagegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px}.brand{font-size:20px}.tag,.sidefoot{display:none}.nav{display:flex;overflow-x:auto;gap:5px;scrollbar-width:thin}.nav button{white-space:nowrap;padding:12px;min-height:44px}.content{padding:15px}.twocol,.boothgrid{grid-template-columns:1fr}.topbar{padding:12px 15px}.pagehead h1{font-size:22px}button,.toolbar input,.toolbar select,.field input,.field select,.field textarea{min-height:42px}}
@media(min-width:700px) and (max-width:1100px){.boothgrid{grid-template-columns:1.15fr 1fr}.packagegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px}}
@media(max-width:480px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.statvalue{font-size:21px}.pagehead{align-items:flex-start;flex-direction:column}.topbar .actions button{padding:8px;font-size:12px}.nav button{font-size:12px}.card{padding:14px}}
@media(orientation:landscape) and (max-width:1100px){.boothgrid{grid-template-columns:1.15fr 1fr}.camera{min-height:220px}}
@media print{.sidebar,.topbar,.no-print,button,.footnote{display:none!important}.app{display:block}.content{padding:0}.main{width:100%}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">📸 Memo<span>shot</span></div><div class="tag">Capture moments. Run your business.</div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button><button data-page="bookings">▣ &nbsp; Bookings</button><button data-page="calendar">▦ &nbsp; Calendar</button><button data-page="packages">▤ &nbsp; Packages</button><button data-page="finance">₱ &nbsp; Income & Expenses</button><button data-page="booth">📷 &nbsp; Photobooth</button>
</nav><div class="sidefoot">MEMOSHOT • FIRST VERSION<br>Saved locally on this device</div></aside>
<main class="main"><header class="topbar"><div><strong id="topTitle">Dashboard</strong><br><small>Photobooth business workspace · phone, tablet & computer</small></div><div class="actions"><button class="secondary" onclick="exportData()">Export backup</button><button onclick="openBooking()">+ New booking</button></div></header><div class="content" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s), money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10);
let state=load();
function load(){try{let x=JSON.parse(localStorage.getItem('memoshot_v1'));if(x)return x}catch(e){}return {bookings:[],packages:[{id:1,name:'Basic Package',price:3500,hours:2,details:'Unlimited digital photos'}, {id:2,name:'Standard Package',price:5500,hours:3,details:'Prints + digital copies'}, {id:3,name:'Premium Package',price:8500,hours:4,details:'Prints, props + online gallery'}],transactions:[],photos:[]}}
function save(){localStorage.setItem('memoshot_v1',JSON.stringify(state))}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(a){return a.reduce((s,n)=>s+Number(n||0),0)}
function totalPaid(b){return sum(state.transactions.filter(t=>t.bookingId===b.id&&t.type==='income').map(t=>t.amount))}
function balance(b){return Math.max(0,Number(b.price||0)-totalPaid(b))}
function pill(s){return `<span class="pill ${esc(s)}">${esc(s)}</span>`}
function page(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=({dashboard:'Dashboard',bookings:'Bookings & Calendar',calendar:'Calendar',packages:'Packages & Payments',finance:'Income & Expenses',booth:'Photobooth Operator'})[p];({dashboard:dashboard,bookings:bookingsPage,calendar:calendarPage,packages:packagesPage,finance:financePage,booth:boothPage}[p])();window.currentPage=p}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});
function stat(label,value,cls=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${cls}">${value}</div></div>`}
function bookingRows(items){if(!items.length)return `<tr><td colspan="7" class="empty">No bookings yet. Add your first event to get started.</td></tr>`;return items.map(b=>`<tr><td><strong>${esc(b.client)}</strong><br><span class="muted">${esc(b.phone||'')}</span></td><td>${esc(b.event)}</td><td>${esc(b.date)}<br>${esc(b.time||'')}</td><td>${esc(b.venue||'—')}</td><td>${money(b.price)}</td><td>${pill(b.status)}</td><td><button class="secondary" onclick="editBooking(${b.id})">Edit</button> <button class="secondary" onclick="recordPayment(${b.id})">Payment</button></td></tr>`).join('')}
function dashboard(){let upcoming=state.bookings.filter(b=>b.date>=today()&&b.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date));let income=sum(state.transactions.filter(t=>t.type==='income').map(t=>t.amount)),expense=sum(state.transactions.filter(t=>t.type==='expense').map(t=>t.amount));$('#view').innerHTML=`<div class="pagehead"><div><h1>Good day, Memoshot! ✨</h1><p>Here's a snapshot of your photobooth business.</p></div></div><div class="grid stats">${stat('Upcoming bookings',upcoming.length,'pink')}${stat('Total income',money(income),'green')}${stat('Pending balances',money(sum(state.bookings.filter(b=>b.status!=='Cancelled').map(balance))),'blue')}${stat('Net cash flow',money(income-expense),income-expense>=0?'green':'pink')}</div><div class="grid twocol"><section class="card"><h2>Upcoming events</h2><div class="calendarlist">${upcoming.slice(0,6).map(b=>`<div class="eventrow"><div><strong>${esc(b.event)} · ${esc(b.client)}</strong><span class="muted">${esc(b.date)} ${esc(b.time||'')} · ${esc(b.venue||'Venue not set')}</span></div>${pill(b.status)}</div>`).join('')||'<div class="empty">No upcoming events.</div>'}</div></section><section class="card"><h2>Quick actions</h2><div class="actions"><button onclick="openBooking()">＋ New booking</button><button class="secondary" onclick="openTransaction('income')">＋ Record income</button><button class="secondary" onclick="openTransaction('expense')">＋ Record expense</button><button class="dark" onclick="page('booth')">📷 Open photobooth</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Recent activity</h2>${state.transactions.slice(-5).reverse().map(t=>`<div class="eventrow"><div><strong>${esc(t.note||t.type)}</strong><span class="muted">${esc(t.date)} · ${esc(t.type)}</span></div><b class="${t.type==='income'?'green':'pink'}">${t.type==='income'?'+':'−'}${money(t.amount)}</b></div>`).join('')||'<p class="muted">Payments and expenses will appear here.</p>'}</section></div><p class="footnote">Your data is stored in this browser on this device. Use Export backup regularly. This starter version does not sync between devices automatically.</p>`}
function bookingsPage(){let sorted=[...state.bookings].sort((a,b)=>a.date.localeCompare(b.date));$('#view').innerHTML=`<div class="pagehead"><div><h1>Bookings</h1><p>Manage clients, event dates, package prices and balances.</p></div><button onclick="openBooking()">＋ Add booking</button></div><div class="toolbar"><input id="searchBookings" placeholder="Search client or event…" oninput="filterBookings()"><select id="statusFilter" onchange="filterBookings()"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div><div class="card tablewrap"><table><thead><tr><th>Client</th><th>Event</th><th>Date / time</th><th>Venue</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="bookingRows">${bookingRows(sorted)}</tbody></table></div>`}
function filterBookings(){let q=$('#searchBookings').value.toLowerCase(),s=$('#statusFilter').value;$('#bookingRows').innerHTML=bookingRows(state.bookings.filter(b=>(`${b.client} ${b.event} ${b.venue}`.toLowerCase().includes(q))&&(!s||b.status===s)).sort((a,b)=>a.date.localeCompare(b.date)))}
function openBooking(bid=null){let b=state.bookings.find(x=>x.id===bid)||{};let options=state.packages.map(p=>`<option value="${p.id}" ${b.packageId===p.id?'selected':''}>${esc(p.name)} — ${money(p.price)}</option>`).join('');$('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${bid?'Edit booking':'New booking'}</h2><button onclick="closeModal()">✕</button></div><form id="bookingForm" class="formgrid"><input type="hidden" name="id" value="${b.id||''}"><div class="field"><label>Client name *</label><input name="client" required value="${esc(b.client||'')}"></div><div class="field"><label>Contact number</label><input name="phone" value="${esc(b.phone||'')}" placeholder="09xx xxx xxxx"></div><div class="field"><label>Event type *</label><input name="event" required value="${esc(b.event||'')}" placeholder="Wedding, birthday…"></div><div class="field"><label>Event date *</label><input name="date" type="date" required min="${today()}" value="${esc(b.date||'')}"></div><div class="field"><label>Start time</label><input name="time" type="time" value="${esc(b.time||'')}"></div><div class="field"><label>Venue</label><input name="venue" value="${esc(b.venue||'')}"></div><div class="field"><label>Package</label><select name="packageId" id="packageSelect"><option value="">Custom / choose later</option>${options}</select></div><div class="field"><label>Total price (₱) *</label><input name="price" type="number" min="0" step=".01" required value="${b.price??''}"></div><div class="field"><label>Status</label><select name="status">${['Pending','Confirmed','Completed','Cancelled'].map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Deposit target (₱)</label><input name="deposit" type="number" min="0" step=".01" value="${b.deposit||0}"></div><div class="field full"><label>Notes / special requests</label><textarea name="notes">${esc(b.notes||'')}</textarea></div><div class="actions full"><button type="submit">Save booking</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button>${bid?`<button type="button" class="danger" onclick="deleteBooking(${bid})">Delete</button>`:''}</div></form></div></div>`;
$('#packageSelect').addEventListener('change',e=>{let p=state.packages.find(x=>x.id===Number(e.target.value));if(p)$('#bookingForm').elements.price.value=p.price});
$('#bookingForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),idv=f.get('id'),old=state.bookings.find(x=>x.id===Number(idv));let obj={id:old?old.id:id(),client:f.get('client').trim(),phone:f.get('phone'),event:f.get('event').trim(),date:f.get('date'),time:f.get('time'),venue:f.get('venue'),packageId:Number(f.get('packageId'))||null,price:Number(f.get('price')),deposit:Number(f.get('deposit')),status:f.get('status'),notes:f.get('notes')};if(old)state.bookings=state.bookings.map(x=>x.id===old.id?obj:x);else state.bookings.push(obj);save();closeModal();page('bookings')}}
function editBooking(id){openBooking(id)}function closeModal(){$('#modalRoot').innerHTML=''}
function deleteBooking(id){if(confirm('Delete this booking? Its transaction records will remain.')){state.bookings=state.bookings.filter(b=>b.id!==id);save();closeModal();page('bookings')}}
function recordPayment(id){let b=state.bookings.find(x=>x.id===id);openTransaction('income',b)}
function openTransaction(type='income',booking=null){$('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>Record ${type==='income'?'income / payment':'expense'}</h2><button onclick="closeModal()">✕</button></div><form id="txForm" class="formgrid"><div class="field"><label>Type</label><select name="type" id="txType"><option value="income" ${type==='income'?'selected':''}>Income</option><option value="expense" ${type==='expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Date *</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Amount (₱) *</label><input name="amount" type="number" min=".01" step=".01" required value="${booking?balance(booking):''}"></div><div class="field"><label>Payment method / category</label><input name="method" placeholder="GCash, cash, supplies…"></div><div class="field full"><label>Link booking (optional)</label><select name="bookingId"><option value="">No linked booking</option>${state.bookings.filter(b=>b.status!=='Cancelled').map(b=>`<option value="${b.id}" ${booking?.id===b.id?'selected':''}>${esc(b.client)} — ${esc(b.event)} (${esc(b.date)})</option>`).join('')}</select></div><div class="field full"><label>Description *</label><input name="note" required value="${booking?'Payment — '+booking.client:''}" placeholder="Deposit, remaining balance, transport…"></div><div class="actions full"><button>Save transaction</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form></div></div>`;
$('#txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.transactions.push({id:id(),type:f.get('type'),date:f.get('date'),amount:Number(f.get('amount')),method:f.get('method'),bookingId:Number(f.get('bookingId'))||null,note:f.get('note')});save();closeModal();page(window.currentPage||'finance')}}
function packagesPage(){$('#view').innerHTML=`<div class="pagehead"><div><h1>Packages & Payments</h1><p>Set your packages and keep track of collected payments.</p></div><button onclick="editPackage()">＋ Add package</button></div><div class="grid packagegrid">${state.packages.map(p=>`<div class="card package"><span class="pill">Photobooth package</span><h3 style="margin-top:12px">${esc(p.name)}</h3><div class="price">${money(p.price)}</div><p>${Number(p.hours)||0} hours · ${esc(p.details||'Custom package')}</p><button class="secondary" onclick="editPackage(${p.id})">Edit package</button></div>`).join('')||'<div class="card empty">No packages yet.</div>'}</div><div class="card" style="margin-top:16px"><h2>Recent payments and transactions</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Method / category</th><th>Amount</th></tr></thead><tbody>${txRows()}</tbody></table></div></div>`}
function editPackage(pid=null){let p=state.packages.find(x=>x.id===pid)||{};$('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${pid?'Edit package':'Add package'}</h2><button onclick="closeModal()">✕</button></div><form id="pkgForm" class="formgrid"><input type="hidden" name="id" value="${p.id||''}"><div class="field"><label>Package name *</label><input name="name" required value="${esc(p.name||'')}"></div><div class="field"><label>Price (₱) *</label><input name="price" type="number" min="0" required value="${p.price??''}"></div><div class="field"><label>Hours included</label><input name="hours" type="number" min="0" value="${p.hours||0}"></div><div class="field"><label>What's included</label><input name="details" value="${esc(p.details||'')}"></div><div class="actions full"><button>Save package</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button>${pid?`<button type="button" class="danger" onclick="removePackage(${pid})">Delete</button>`:''}</div></form></div></div>`;$('#pkgForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:Number(f.get('id'))||id(),name:f.get('name'),price:Number(f.get('price')),hours:Number(f.get('hours')),details:f.get('details')};let ix=state.packages.findIndex(x=>x.id===o.id);if(ix>=0)state.packages[ix]=o;else state.packages.push(o);save();closeModal();page('packages')}}
function removePackage(id){if(confirm('Delete this package? Existing bookings are kept.')){state.packages=state.packages.filter(p=>p.id!==id);save();closeModal();page('packages')}}
function txRows(){return [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.note)}</td><td>${pill(t.type==='income'?'Paid':'Expense')}</td><td>${esc(t.method||'—')}</td><td class="${t.type==='income'?'green':'pink'}">${t.type==='income'?'+':'−'}${money(t.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>'}
function financePage(){let inc=sum(state.transactions.filter(t=>t.type==='income').map(t=>t.amount)),exp=sum(state.transactions.filter(t=>t.type==='expense').map(t=>t.amount));$('#view').innerHTML=`<div class="pagehead"><div><h1>Income & Expenses</h1><p>Track cash flow. Net shown here is based on transactions you record.</p></div><div class="actions"><button onclick="openTransaction('income')">＋ Income</button><button class="dark" onclick="openTransaction('expense')">＋ Expense</button></div></div><div class="grid stats">${stat('Total income',money(inc),'green')}${stat('Total expenses',money(exp),'pink')}${stat('Net cash flow',money(inc-exp),inc>=exp?'green':'pink')}${stat('Transactions',state.transactions.length,'blue')}</div><div class="card"><div class="toolbar"><input id="txSearch" placeholder="Search descriptions…" oninput="filterTx()"><button class="secondary" onclick="exportCSV()">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Method / category</th><th>Amount</th></tr></thead><tbody id="txRows">${txRows()}</tbody></table></div></div>`}
function filterTx(){let q=$('#txSearch').value.toLowerCase();$('#txRows').innerHTML=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).filter(t=>(t.note+' '+t.method+' '+t.type).toLowerCase().includes(q)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.note)}</td><td>${pill(t.type==='income'?'Paid':'Expense')}</td><td>${esc(t.method||'—')}</td><td>${t.type==='income'?'+':'−'}${money(t.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matches.</td></tr>'}
function calendarPage(){let events=state.bookings.filter(b=>b.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date));$('#view').innerHTML=`<div class="pagehead"><div><h1>Event calendar</h1><p>Upcoming bookings grouped by date.</p></div><button onclick="openBooking()">＋ Add booking</button></div><div class="card"><div class="toolbar"><input type="date" id="calFrom" value="${today()}" onchange="filterCalendar()"><input type="date" id="calTo" onchange="filterCalendar()"></div><div id="calendarEvents" class="calendarlist">${calendarRows(events)}</div></div>`}
function calendarRows(arr){return arr.map(b=>`<div class="eventrow"><div><strong>${esc(b.date)} ${esc(b.time||'')} · ${esc(b.event)}</strong><span class="muted">${esc(b.client)} · ${esc(b.venue||'Venue not set')} · ${money(b.price)} · balance ${money(balance(b))}</span></div><div>${pill(b.status)} <button class="secondary" onclick="editBooking(${b.id})">Edit</button></div></div>`).join('')||'<div class="empty">No events in this date range.</div>'}
function filterCalendar(){let from=$('#calFrom').value,to=$('#calTo').value;$('#calendarEvents').innerHTML=calendarRows(state.bookings.filter(b=>b.status!=='Cancelled'&&(!from||b.date>=from)&&(!to||b.date<=to)).sort((a,b)=>a.date.localeCompare(b.date)))}
let stream=null,captured=[],sessionTimer=null,sessionRunning=false;
async function boothPage(){$('#view').innerHTML=`<div class="pagehead"><div><h1>Photobooth operator</h1><p>Preview camera, capture photos, and print a simple photo sheet.</p></div></div><div class="notice"><strong>Sony ZV-E10 + Epson L8050 setup:</strong> Camera access supports compatible phone/tablet front and rear cameras, built-in webcams, USB webcams, and supported video inputs in the browser. For live preview from the Sony, connect it by USB and use a compatible webcam/video input or capture card. For remote still-photo shooting, install Sony Imaging Edge Desktop and enable PC Remote on the camera. This browser app cannot directly take over Sony tethered shooting by itself. The Epson prints through the computer's installed driver and print dialog.</div><div class="grid boothgrid"><div class="card"><h2>Camera & automatic session</h2><div class="formgrid" style="margin-bottom:10px"><div class="field"><label>Camera source (phone, tablet, USB or webcam)</label><select id="cameraSource"><option value="">Use selected camera direction</option></select></div><div class="field"><label>Camera direction</label><select id="cameraFacing"><option value="user">Front / selfie camera</option><option value="environment">Rear / back camera</option><option value="default">Device default camera</option></select></div></div><div class="actions" style="margin-bottom:10px"><button class="secondary" onclick="refreshCameraList()">Refresh camera list</button></div><div class="camera" id="camera"><div class="placeholder">📷<br><br>Connect or select your camera<br><small>For Sony ZV-E10, use a compatible USB streaming/video source</small></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Photos per session</label><select id="shotCount"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Countdown before each photo</label><select id="shotDelay"><option value="3">3 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option></select></div></div><div id="sessionStatus" class="notice" style="margin-top:12px;margin-bottom:0">Ready when you are. Start the camera, then start an automatic session.</div><div class="actions" style="margin-top:12px"><button onclick="startCamera()">Start / refresh camera</button><button class="dark" onclick="startAutomaticSession()">▶ Start automatic session</button><button class="secondary" onclick="capture()">● Single capture</button><button class="secondary" onclick="stopCamera()">Stop camera</button><label class="secondary" style="padding:10px 13px;border-radius:9px;cursor:pointer">Upload photo<input type="file" accept="image/*" multiple hidden onchange="uploadPhotos(event)"></label></div><div class="footnote">Automatic sessions capture frames from the selected browser video source. Use Sony PC Remote in Imaging Edge Desktop for full-resolution tethered stills; direct shutter integration is not included in this browser-only build.</div></div><div class="card"><h2>Print layout</h2><div class="field"><label>Event label</label><input id="printLabel" value="Memoshot memories"></div><div class="field" style="margin-top:12px"><label>Layout</label><select id="layout"><option value="strip">2 × 6 inch photo strip</option><option value="4x6">4 × 6 inch photo sheet</option><option value="a4">A4 photo sheet</option></select></div><div class="card" style="margin-top:14px;padding:13px;background:#f8fafc"><h2 style="margin-bottom:10px">Customizable frame template</h2><div class="formgrid"><div class="field"><label>Frame title</label><input id="frameTitle" value="MEMOSHOT"></div><div class="field"><label>Footer text</label><input id="frameFooter" value="Thank you for celebrating with us!"></div><div class="field"><label>Frame background</label><input id="frameBg" type="color" value="#111827"></div><div class="field"><label>Border / accent</label><input id="frameAccent" type="color" value="#f45b91"></div><div class="field"><label>Text color</label><input id="frameText" type="color" value="#ffffff"></div><div class="field"><label>Frame style</label><select id="frameStyle"><option value="classic">Classic border</option><option value="rounded">Rounded corners</option><option value="minimal">Minimal</option></select></div><div class="field full"><label>Optional logo image</label><input id="frameLogoInput" type="file" accept="image/*"><small class="muted">Choose a PNG or JPG logo. It is stored in this browser with your frame settings.</small></div></div><div class="actions" style="margin-top:10px"><button class="secondary" onclick="saveFrameTemplate()">Save frame template</button><button class="secondary" onclick="resetFrameTemplate()">Reset template</button></div></div><div id="photoStrip" class="frame-preview"><div class="frame-title">MEMOSHOT</div><div class="strip"></div><div class="frame-footer">Thank you for celebrating with us!</div></div><div class="actions" style="margin-top:14px"><button onclick="printSheet()">Print photo sheet</button><button class="secondary" onclick="clearPhotos()">Clear photos</button></div><p class="muted">For printing, choose the Epson L8050 in the print dialog. Set the paper size to match the selected layout and enable Borderless only when supported by your paper settings.</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h2>Equipment setup checklist</h2><ol class="muted"><li>Install the Epson L8050 driver and confirm a test photo prints from this computer.</li><li>For Sony remote shooting, install <a href="https://support.d-imaging.sony.co.jp/app/imagingedge/en/" target="_blank" rel="noopener">Sony Imaging Edge Desktop</a>.</li><li>On the ZV-E10, turn Smartphone Connection off, enable MENU → Image (Network) → PC Remote Function → PC Remote, then connect by USB and open Imaging Edge Desktop (Remote).</li><li>For automatic browser sessions, use any camera source the browser can access, including phone/tablet cameras, a supported Sony USB Streaming video input, or compatible HDMI capture card. For full-resolution tethered stills, use Imaging Edge Desktop (Remote); this web app does not trigger that app's shutter directly.</li></ol></div></div>`;loadFrameControls();['frameTitle','frameFooter','frameBg','frameAccent','frameText','frameStyle','layout'].forEach(id=>{let el=$('#'+id);if(el)el.addEventListener('input',renderPhotos)});$('#frameLogoInput')?.addEventListener('change',e=>{let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{state.frameTemplate={...getFrame(),logo:r.result};save();renderPhotos()};r.readAsDataURL(file)});renderPhotos()}
async function refreshCameraList(){try{if(!navigator.mediaDevices?.enumerateDevices)throw new Error('This browser does not support camera selection.');let devices=await navigator.mediaDevices.enumerateDevices(),cams=devices.filter(d=>d.kind==='videoinput'),sel=$('#cameraSource');if(!sel)return;let prior=sel.value;sel.innerHTML='<option value="">Use selected camera direction</option>'+cams.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||'Camera '+(i+1))}</option>`).join('');if(prior)sel.value=prior;if(!cams.length)sel.innerHTML='<option value="">No camera listed yet — allow permission and refresh</option>'}catch(e){console.warn('Camera list unavailable',e)}}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera access is not available in this browser context. Open this app in Chrome or another modern browser using HTTPS or localhost, then allow camera permission.');stopCamera(false);let chosen=$('#cameraSource')?.value,facing=$('#cameraFacing')?.value||'user';let video=chosen?{deviceId:{exact:chosen},width:{ideal:1920},height:{ideal:1080}}:{width:{ideal:1920},height:{ideal:1080},...(facing==='default'?{}:{facingMode:{ideal:facing}})};stream=await navigator.mediaDevices.getUserMedia({video,audio:false});let c=$('#camera');c.innerHTML='<video autoplay playsinline id="liveVideo" style="width:100%;max-height:470px;object-fit:contain"></video>';$('#liveVideo').srcObject=stream;await $('#liveVideo').play();await refreshCameraList();let status=$('#sessionStatus');if(status)status.textContent='Camera ready. You can switch between front/rear cameras or choose a listed webcam/video input. If you change cameras, stop and start the camera again.'}catch(e){let msg=e.name==='NotAllowedError'?'Camera permission was denied. Allow camera access in your browser or device settings, then try again.':e.name==='NotFoundError'?'No compatible camera was found. Check that a camera is available and not disabled.':e.message;alert('Could not open camera. '+msg+'\n\nFor phone/tablet access, open the app in a modern browser over HTTPS (or localhost) and grant camera permission.')}}
function stopCamera(update=true){if(sessionTimer){clearTimeout(sessionTimer);sessionTimer=null}sessionRunning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;let c=$('#camera');if(c&&update)c.innerHTML='<div class="placeholder">Camera stopped</div>';if(update){let s=$('#sessionStatus');if(s)s.textContent='Camera stopped.'}}
function capture(silent=false){let v=$('#liveVideo');if(!v||!v.videoWidth){if(!silent)alert('Start the camera first.');return false}let can=document.createElement('canvas');can.width=v.videoWidth;can.height=v.videoHeight;can.getContext('2d').drawImage(v,0,0);captured.push(can.toDataURL('image/jpeg',.94));renderPhotos();return true}
function startAutomaticSession(){if(sessionRunning)return;let v=$('#liveVideo');if(!v||!v.videoWidth){alert('Start the camera first.');return}sessionRunning=true;let total=Number($('#shotCount').value)||4,delay=Number($('#shotDelay').value)||3,done=0;let status=$('#sessionStatus');let runCountdown=()=>{if(!sessionRunning)return;if(done>=total){sessionRunning=false;sessionTimer=null;if(status)status.textContent=`Session complete — ${done} photos captured. Review the photos, then print the layout.`;return}let remain=delay;let tick=()=>{if(!sessionRunning)return;if(status)status.textContent=`Photo ${done+1} of ${total} in ${remain}… Please look at the camera!`;if(remain<=0){if(capture(true))done++;remain=delay;sessionTimer=setTimeout(runCountdown,900);return}remain--;sessionTimer=setTimeout(tick,1000)};tick()};runCountdown()}

function loadFrameControls(){let f=state.frameTemplate||{title:'MEMOSHOT',footer:'Thank you for celebrating with us!',bg:'#111827',accent:'#f45b91',text:'#ffffff',style:'classic',logo:''};[['frameTitle','title'],['frameFooter','footer'],['frameBg','bg'],['frameAccent','accent'],['frameText','text'],['frameStyle','style']].forEach(([id,k])=>{let el=$('#'+id);if(el)el.value=f[k]||''});renderPhotos()}
